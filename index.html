<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:#0f172a;color:#f1f5f9;height:100vh;overflow:hidden;user-select:none}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative}
#slide{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;padding:40px 80px;transition:opacity .25s}
.fade{opacity:0}
/* nav */
.nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:80px;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:2rem;cursor:pointer;border-radius:10px;z-index:99;transition:background .2s}
.nav:hover{background:rgba(255,255,255,.18)}
#prev{left:8px}#next{right:8px}
#bar{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width .3s;z-index:99}
#ctr{position:fixed;bottom:8px;right:16px;font-size:.78rem;color:rgba(255,255,255,.4);z-index:99}
/* part tag */
.ptag{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:.05em;margin-bottom:14px;text-transform:uppercase}
/* slide layouts */
.slide-inner{width:100%;max-width:1100px;margin:0 auto}
.stitle{text-align:center;padding:20px 0}
.stitle h1{font-size:3.2rem;font-weight:900;line-height:1.2;margin-bottom:.6rem}
.stitle p{font-size:1.15rem;color:rgba(255,255,255,.55)}
.shdr{font-size:2rem;font-weight:800;margin-bottom:1.2rem;line-height:1.2}
/* cards */
.cards{display:grid;gap:14px;margin-top:8px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:1fr 1fr 1fr}
.card{background:rgba(255,255,255,.06);border-radius:14px;padding:18px 20px;border:1px solid rgba(255,255,255,.08)}
.card h3{font-size:1rem;margin-bottom:6px}
.card p,.card li{font-size:.88rem;color:rgba(255,255,255,.7);line-height:1.6}
.card ul{padding-left:16px}
/* case study */
.case{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.3);border-radius:14px;padding:20px 22px;margin-top:10px}
.case .case-hdr{color:#f59e0b;font-weight:700;font-size:.85rem;margin-bottom:8px}
.case h3{font-size:1.05rem;margin-bottom:8px}
.case p{font-size:.88rem;color:rgba(255,255,255,.75);line-height:1.65}
.case .disc{margin-top:10px;font-size:.83rem;color:#fbbf24;font-style:italic}
/* discussion */
.discuss{background:rgba(6,182,212,.07);border:1px solid rgba(6,182,212,.25);border-radius:14px;padding:18px 22px;margin-top:10px}
.discuss .q{font-size:.9rem;color:#67e8f9;margin:5px 0;padding-left:14px;position:relative}
.discuss .q::before{content:'💬';position:absolute;left:-2px;font-size:.75rem;top:2px}
/* list */
.ilist{list-style:none;padding:0;margin-top:8px}
.ilist li{padding:7px 0 7px 28px;position:relative;font-size:.9rem;color:rgba(255,255,255,.8);border-bottom:1px solid rgba(255,255,255,.05)}
.ilist li::before{content:'▸';position:absolute;left:6px;color:#6366f1}
/* highlight */
.hl{color:#a5b4fc;font-weight:700}
/* two col */
.tcol{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;height:100%}
/* stat */
.stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:14px 20px;text-align:center;flex:1;min-width:120px}
.stat .num{font-size:1.8rem;font-weight:900;color:#a5b4fc}
.stat .lbl{font-size:.75rem;color:rgba(255,255,255,.5);margin-top:2px}
/* ===== SLIDE 2 WORDCLOUD ===== */
#wc-wrap{display:flex;flex-direction:column;gap:10px;height:calc(100vh - 130px)}
#wc-form{display:flex;gap:8px}
#wc-input{flex:1;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:1rem;font-family:inherit}
#wc-input::placeholder{color:rgba(255,255,255,.35)}
#wc-btn{padding:10px 22px;border-radius:10px;background:#6366f1;color:#fff;border:none;font-size:.95rem;cursor:pointer;font-family:inherit;white-space:nowrap}
#wc-btn:hover{background:#4f46e5}
#wc-canvas{flex:1;width:100%;border-radius:14px;background:rgba(0,0,0,.25)}
#wc-status{font-size:.78rem;color:rgba(255,255,255,.4);text-align:center}
/* ===== SLIDE 6 ERA SLIDER ===== */
#era-wrap{display:grid;grid-template-columns:1fr 340px;gap:24px;height:calc(100vh - 130px);align-items:start}
#era-text{overflow-y:auto;height:100%}
.era-sec{position:relative;border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:background .4s,border-color .4s;border:1px solid rgba(255,255,255,.1)}
.era-sec .before,.era-sec .after{transition:opacity .4s}
.era-sec .after{position:absolute;top:16px;left:18px;right:18px;opacity:0}
.era-sec h3{font-size:.95rem;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.era-sec p{font-size:.85rem;line-height:1.65;color:rgba(255,255,255,.75)}
#era-ctrl{position:sticky;top:0;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border-radius:14px;padding:22px 20px}
#era-ctrl h3{font-size:1.1rem;margin-bottom:16px;text-align:center}
#era-slider{width:100%;height:6px;-webkit-appearance:none;appearance:none;border-radius:3px;outline:none;cursor:pointer;margin:20px 0}
#era-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#6366f1;cursor:pointer;box-shadow:0 0 8px rgba(99,102,241,.6)}
.era-labels{display:flex;justify-content:space-between;font-size:.78rem;color:rgba(255,255,255,.5);margin-top:-10px}
#era-pct{text-align:center;font-size:2rem;font-weight:900;margin:10px 0;color:#a5b4fc}
#era-badge{text-align:center;font-size:.9rem;padding:8px 16px;border-radius:8px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3)}
.era-diff{margin-top:14px}
.era-diff h4{font-size:.8rem;color:rgba(255,255,255,.5);margin-bottom:8px}
.diff-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.78rem}
.diff-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.diff-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#f59e0b,#6366f1);transition:width .4s}
/* ===== SLIDE 100 RADAR ===== */
#radar-wrap{display:grid;grid-template-columns:320px 1fr;gap:24px;height:calc(100vh - 130px);align-items:center}
#radar-ctrl{overflow-y:auto;height:100%;padding-right:8px}
.r-item{margin-bottom:16px}
.r-item label{font-size:.85rem;display:flex;justify-content:space-between;margin-bottom:5px}
.r-item label span{color:#a5b4fc;font-weight:700}
.r-slider{width:100%;height:5px;-webkit-appearance:none;appearance:none;border-radius:3px;background:rgba(255,255,255,.1);outline:none;cursor:pointer}
.r-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#6366f1;cursor:pointer}
#radar-chart-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
#radar-score{font-size:1rem;color:rgba(255,255,255,.6);margin-top:10px;text-align:center}
#radar-msg{font-size:.85rem;color:#a5b4fc;text-align:center;margin-top:6px;font-style:italic}
</style>

// ── Render ──────────────────────────────────────────────────────
let cur = 0;
const slideEl = document.getElementById('slide');
const barEl = document.getElementById('bar');
const ctrEl = document.getElementById('ctr');

const PART_COLORS = {
  'Part 1 · 認識AI':   '#6366f1',
  'Part 2 · AI與社會': '#ec4899',
  'Part 3 · AI倫理':   '#f59e0b',
  'Part 4 · AI素養':   '#10b981',
  'Part 5 · 規範治理': '#3b82f6',
  'Part 6 · 未來展望': '#8b5cf6',
};

function renderSlide(i) {
  const s = S[i];
  document.body.style.background = s.bg;
  slideEl.innerHTML = buildHTML(s);
  barEl.style.width = ((i+1)/S.length*100)+'%';
  ctrEl.textContent = (i+1)+' / '+S.length;
  // special inits after DOM ready
  if (s.type==='wordcloud')  setTimeout(initWordCloud, 50);
  if (s.type==='slider')     setTimeout(initSlider, 50);
  if (s.type==='radar')      setTimeout(initRadar, 50);
}

function buildHTML(s) {
  if (s.type === 'title') return buildTitle(s);
  if (s.type === 'wordcloud') return buildWordCloud(s);
  if (s.type === 'slider') return buildSlider(s);
  if (s.type === 'radar') return buildRadar(s);
  if (s.type === 'case') return buildCase(s);
  if (s.type === 'discuss') return buildDiscuss(s);
  if (s.type === 'grid') return buildGrid(s);
  return buildContent(s);
}

function ptag(s) {
  if (!s.part) return '';
  const c = PART_COLORS[s.part] || '#6366f1';
  return `<div class="ptag" style="background:${c}22;color:${c};border:1px solid ${c}55">${s.part}</div>`;
}

function buildTitle(s) {
  return `<div class="slide-inner stitle">
    <div style="font-size:4rem;margin-bottom:1rem">${s.icon||'🤖'}</div>
    <h1 style="font-size:3rem;font-weight:900;background:linear-gradient(90deg,#6366f1,#ec4899,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.8rem">${s.title}</h1>
    <p style="font-size:1.2rem;color:rgba(255,255,255,.6);margin-bottom:.5rem">${s.sub||''}</p>
    <p style="font-size:.95rem;color:rgba(255,255,255,.4)">${s.desc||''}</p>
    <div style="margin-top:2rem;font-size:.8rem;color:rgba(255,255,255,.25)">按 → 開始</div>
  </div>`;
}

function buildContent(s) {
  const items = (s.items||[]).map(it=>`
    <li class="ilist" style="list-style:none;padding:8px 0 8px 28px;position:relative;font-size:.9rem;border-bottom:1px solid rgba(255,255,255,.05);color:rgba(255,255,255,.85)">
      <span style="position:absolute;left:6px;color:#6366f1">▸</span>
      <strong>${it.h}</strong><span style="color:rgba(255,255,255,.55)"> — </span>${it.p}
    </li>`).join('');
  const note = s.note ? `<p style="margin-top:12px;font-size:.82rem;color:#fbbf24">${s.note}</p>` : '';
  return `<div class="slide-inner">${ptag(s)}
    <h1 class="shdr">${s.icon||''} ${s.title}</h1>
    ${s.desc?`<p style="color:rgba(255,255,255,.55);margin-bottom:14px;font-size:.9rem">${s.desc}</p>`:''}
    <ul style="padding:0;list-style:none">${items}</ul>${note}
  </div>`;
}

function buildGrid(s) {
  const cards = (s.cards||[]).map(c=>`
    <div class="card">
      <div style="font-size:1.8rem;margin-bottom:8px">${c.icon||''}</div>
      <h3>${c.h}</h3>
      <p>${c.p}</p>
    </div>`).join('');
  const cols = s.cards && s.cards.length <= 3 ? s.cards.length : Math.min(s.cards.length, 3);
  return `<div class="slide-inner">${ptag(s)}
    <h1 class="shdr">${s.icon||''} ${s.title}</h1>
    ${s.desc?`<p style="color:rgba(255,255,255,.55);margin-bottom:14px;font-size:.9rem">${s.desc}</p>`:''}
    <div class="cards" style="grid-template-columns:repeat(${cols},1fr)">${cards}</div>
  </div>`;
}

function buildCase(s) {
  const cases = (s.cases||[]).map(c=>`
    <div class="case">
      <div class="case-hdr">📌 ${c.tag}</div>
      <h3>${c.h}</h3>
      <p style="white-space:pre-line">${c.p}</p>
      <p class="disc">💬 討論：${c.disc}</p>
    </div>`).join('');
  return `<div class="slide-inner">${ptag(s)}
    <h1 class="shdr">${s.icon||''} ${s.title}</h1>
    ${cases}
  </div>`;
}

function buildDiscuss(s) {
  const qs = (s.qs||[]).map((q,i)=>`
    <div class="discuss" style="margin-bottom:10px">
      <p class="q">Q${i+1}：${q}</p>
    </div>`).join('');
  return `<div class="slide-inner">${ptag(s)}
    <h1 class="shdr">${s.icon||''} ${s.title}</h1>
    ${qs}
  </div>`;
}

// ── Slide 2: Word Cloud ──────────────────────────────────────────
function buildWordCloud(s) {
  return `<div class="slide-inner" style="max-width:900px;height:calc(100vh - 100px);display:flex;flex-direction:column">
    ${ptag(s)}
    <h1 class="shdr" style="font-size:1.6rem;margin-bottom:8px">💬 ${s.title}</h1>
    <p style="font-size:.85rem;color:rgba(255,255,255,.45);margin-bottom:10px">${s.sub||''}</p>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="wc-input" placeholder="輸入你的理由（可多次輸入）" maxlength="30" onkeydown="if(event.key==='Enter')wcSubmit()"/>
      <button id="wc-btn" onclick="wcSubmit()">送出</button>
    </div>
    <div id="wc-status">等待輸入…</div>
    <canvas id="wc-canvas" style="flex:1;width:100%;border-radius:14px;background:rgba(0,0,0,.25);margin-top:8px"></canvas>
  </div>`;
}

let wcWords = {};

function initWordCloud() {
  const el = document.getElementById('wc-status');
  if (el) el.textContent = `目前共 ${Object.values(wcWords).reduce((a,b)=>a+b,0)} 筆回應`;
  drawWC();
}

function drawWC() {
  const canvas = document.getElementById('wc-canvas');
  if (!canvas) return;
  const list = Object.entries(wcWords).map(([w,c]) => [w, Math.max(14, c * 20)]);
  if (!list.length) return;
  try {
    WordCloud(canvas, {
      list, gridSize: 10, weightFactor: 1,
      fontFamily: 'Microsoft JhengHei, PingFang TC, sans-serif',
      color: () => `hsl(${Math.floor(Math.random()*360)},75%,65%)`,
      rotateRatio: 0.2, rotationSteps: 2,
      backgroundColor: 'transparent', drawOutOfBound: false,
    });
  } catch(e){}
}

function wcSubmit() {
  const inp = document.getElementById('wc-input');
  if (!inp) return;
  const word = inp.value.trim();
  if (!word) return;
  wcWords[word] = (wcWords[word] || 0) + 1;
  inp.value = '';
  const total = Object.values(wcWords).reduce((a,b)=>a+b,0);
  const el = document.getElementById('wc-status');
  if (el) el.textContent = `目前共 ${total} 筆回應`;
  drawWC();
}

document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});

    <h1 class="shdr" style="font-size:1.8rem;margin-bottom:4px">⏳ ${s.title}</h1>
    <p style="font-size:.82rem;color:rgba(255,255,255,.4);margin-bottom:14px">${s.sub||''}</p>

function initSlider() {
  updateSlider(0);
}

function updateSlider(v) {
  v = parseInt(v);
  const pctEl = document.getElementById('era-pct');
  const badgeEl = document.getElementById('era-badge');
  if (pctEl) pctEl.textContent = v + '%';
  if (badgeEl) {
    if (v < 30) { badgeEl.textContent = '📚 傳統學習時代'; badgeEl.style.color='#fbbf24'; }
    else if (v < 70) { badgeEl.textContent = '⚡ 過渡轉型期'; badgeEl.style.color='#a3e635'; }
    else { badgeEl.textContent = '🤖 AI 增強時代'; badgeEl.style.color='#a5b4fc'; }
  }
  // update diff bars
  const bases = [20,30,40,70];
  const gains = [70,50,30,-20];
  bases.forEach((b,i) => {
    const el = document.getElementById('diff-'+i);
    if (el) el.style.width = Math.max(5, Math.min(100, b + gains[i]*v/100)) + '%';
  });
  // build era text
  const textEl = document.getElementById('era-text');
  if (!textEl) return;
  textEl.innerHTML = ERA_BEFORE.map((b,i) => {
    const a = ERA_AFTER[i];
    const secV = Math.max(0, Math.min(1, (v/100 - i*0.25) / 0.25));
    const bOp = Math.max(0, 1-secV*2);
    const aOp = Math.max(0, secV*2-1);
    const midOp = 1 - bOp - aOp;
    const bg = secV > 0.5 ? 'rgba(99,102,241,.08)' : 'rgba(245,158,11,.06)';
    const border = secV > 0.5 ? 'rgba(99,102,241,.3)' : 'rgba(245,158,11,.2)';
    return `<div style="border-radius:12px;padding:14px 16px;margin-bottom:10px;background:${bg};border:1px solid ${border};transition:all .3s;position:relative;min-height:90px">
      <h3 style="font-size:.88rem;margin-bottom:6px;color:rgba(255,255,255,.7)">${b.time}</h3>
      <div style="position:relative">
        <p style="font-size:.82rem;line-height:1.65;color:rgba(255,255,255,.75);opacity:${(bOp+midOp*(1-secV)).toFixed(2)};transition:opacity .3s">${b.text}</p>
        <p style="position:absolute;top:0;left:0;right:0;font-size:.82rem;line-height:1.65;color:rgba(200,210,255,.85);opacity:${(aOp+midOp*secV).toFixed(2)};transition:opacity .3s">${a.text}</p>
      </div>
    </div>`;
  }).join('');
}

// ── Slide 100: Radar Chart ──────────────────────────────────────
const DIMS = ['AI知識理解','批判性思考','倫理意識','實際應用','資訊識讀','負責任使用'];
const DESCS = [
  '了解 AI 原理、限制、歷史','質疑 AI 輸出，不盲目相信',
  '理解並實踐 AI 倫理原則','能有效使用 AI 工具輔助學習',
  '辨識假訊息和 AI 生成內容','使用 AI 時考慮對他人的影響',
];

function buildRadar(s) {
  return `<div class="slide-inner" style="max-width:1000px;height:calc(100vh - 100px);display:flex;flex-direction:column">
    ${ptag(s)}
    <h1 class="shdr" style="font-size:1.8rem;margin-bottom:6px">📊 ${s.title}</h1>
    <p style="font-size:.82rem;color:rgba(255,255,255,.4);margin-bottom:12px">${s.sub||''}</p>
    <div id="radar-wrap">
      <div id="radar-ctrl">
        ${DIMS.map((d,i)=>`
        <div class="r-item">
          <label>${d} <span id="rv-${i}">3</span>/5
            <small style="color:rgba(255,255,255,.35);font-weight:400;font-size:.7rem">&nbsp;${DESCS[i]}</small>
          </label>
          <input class="r-slider" type="range" min="0" max="5" value="3"
            oninput="document.getElementById('rv-${i}').textContent=this.value;updateRadar()">
        </div>`).join('')}
      </div>
      <div id="radar-chart-wrap">
        <canvas id="radar-chart" width="340" height="340"></canvas>
        <div id="radar-score"></div>
        <div id="radar-msg"></div>
      </div>
    </div>
  </div>`;
}

let radarInst = null;
function initRadar() {
  const ctx = document.getElementById('radar-chart');
  if (!ctx) return;
  if (radarInst) { radarInst.destroy(); radarInst = null; }
  radarInst = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: DIMS,
      datasets: [{
        label: '我的 AI 素養',
        data: [3,3,3,3,3,3],
        backgroundColor: 'rgba(99,102,241,.2)',
        borderColor: '#6366f1',
        pointBackgroundColor: '#a5b4fc',
        pointRadius: 4,
      }]
    },
    options: {
      scales: { r: { min:0, max:5, ticks:{ stepSize:1, color:'rgba(255,255,255,.35)', backdropColor:'transparent' },
        grid:{color:'rgba(255,255,255,.1)'}, angleLines:{color:'rgba(255,255,255,.1)'},
        pointLabels:{color:'#e2e8f0',font:{size:11,family:'Microsoft JhengHei'}}}},
      plugins:{ legend:{ labels:{color:'#f1f5f9',font:{size:11}}}},
      animation:{ duration:300 }
    }
  });
  updateRadar();
}

function updateRadar() {
  const sliders = document.querySelectorAll('.r-slider');
  if (!sliders.length) return;
  const vals = Array.from(sliders).map(s=>parseFloat(s.value));
  if (radarInst) { radarInst.data.datasets[0].data = vals; radarInst.update(); }
  const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
  const scoreEl = document.getElementById('radar-score');
  const msgEl = document.getElementById('radar-msg');
  if (scoreEl) scoreEl.textContent = `平均分數：${avg} / 5`;
  if (msgEl) {
    const msgs = ['繼續學習，你已踏上 AI 素養之路！','有不錯的基礎，持續練習批判思考！','很棒！你具備良好的 AI 素養！','優秀！你已是負責任的 AI 使用者！','卓越！歡迎加入 AI 倫理推廣行列！'];
    msgEl.textContent = msgs[Math.min(4,Math.floor(avg))];
  }
}

// ── Navigation ──────────────────────────────────────────────────
function go(d) {
  const next = Math.max(0, Math.min(S.length-1, cur+d));
  if (next===cur) return;
  slideEl.style.opacity='0';
  slideEl.style.transform='translateX('+(d>0?'30px':'-30px')+')';
  setTimeout(()=>{
    cur = next;
    renderSlide(cur);
    slideEl.style.transition='none';
    slideEl.style.transform='translateX('+(d>0?'-30px':'30px')+')';
    slideEl.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      slideEl.style.transition='opacity .25s,transform .25s';
      slideEl.style.opacity='1';
      slideEl.style.transform='translateX(0)';
    }));
  }, 200);
}

slideEl.style.transition='opacity .25s,transform .25s';
renderSlide(0);
</script>
</body>
